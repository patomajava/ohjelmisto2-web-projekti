<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaajan tiedot</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <script src="{{url_for('static', filename='js/scripts.js')}}" defer></script>
</head>
<body>

    <!-- VÄLIAIKAINEN NAVIGOINTI: poistetaan myöhemmin -->
    <nav class="valiaikainen-nav">
        <span>Väliaikainen navigointi:</span>
        <a href="{{url_for('index')}}">Etusivu</a>
        <a href="{{url_for('peli_uusi')}}">Uusi peli</a>
        <a href="{{url_for('peli_lataa')}}">Lataa peli</a>
        <a href="{{url_for('peli')}}">Peli</a>
        <a href="{{url_for('tulokset')}}">Tulokset</a>
    </nav>

    <main class="sivu lomake-sivu">

        <h1 class="sivun-otsikko">Pelaajan tiedot</h1>

        <section class="paneeli" id="form">

            <form action="#" class="lomake" method="POST">

                <div class="kentta">
                    <label for="nimi">Pelaajan nimi</label>
                    <input id="nimi" name="pelaajan_nimi" type="text" placeholder="Kirjoita nimi" required>
                </div>

                <div class="kentta">
                    <label for="ika">Pelaajan ikä</label>
                    <input id="ika" name="pelaajan_ika" type="text" placeholder="Kirjoita ikä" required>
                </div>
                    <div class="nappirivi">
                        <input id="aloita" class="nappi nappi-paa" value="Aloita" type="submit">
                        <button id="poistu" class="nappi">Palaa päävalikkoon</button>
                    </div>
            </form>

        </section>
    </main>
</body>
</html>
