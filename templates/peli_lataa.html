<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <main class="sivu lomake-sivu">
        <h1 class="sivun-otsikko">Lataa peli</h1>

        <section class="paneeli">
            <h2>Valitse tallennus</h2>
            <p class="lomake-kuvaus">Valitse tallennettu peli jatkaaksesi siitä, mihin jäit.</p>

            <form action="#" class="lomake" method="POST">
                <div class="kentta">
                    <select id="tallennus" name="tallennus" required>
                        <option value="" selected disabled>Valitse tallennus</option>
                    </select>
                </div>

                <input class="nappi nappi-paa" type="submit" value="Lataa peli">
            </form>
        </section>
    </main>
