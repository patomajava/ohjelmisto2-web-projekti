<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peli</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <script src="{{url_for('static', filename='js/scripts.js')}}" defer></script>
</head>
<body>

    <!-- VÄLIAIKAINEN NAVIGOINTI: poistetaan myöhemmin -->
    <nav class="valiaikainen-nav">
        <span>Väliaikainen navigointi:</span>
        <a href="{{url_for('index')}}">Etusivu</a>
        <a href="{{url_for('peli_uusi')}}">Uusi peli</a>
        <a href="{{url_for('peli_lataa')}}">Lataa peli</a>
        <a href="{{url_for('peli')}}">Peli</a>
        <a href="{{url_for('tulokset')}}">Tulokset</a>
    </nav>

    <main class="sivu peli-sivu">

        <header class="peli-ylapalkki">
            <span class="peli-valikko">Valikko</span>
            <span class="peli-tilateksti">Tilateksti</span>
        </header>

        <section class="tekstilaatikko">
            <h2 id="nykyinen_huone">Nykyinen huone</h2>
            <p id="tarinateksti">Tarinateksti</p>
        </section>

        <section class="peli-alue">

            <div class="sivupaneeli">
                <h3>Esineet ja mekanismit</h3>
                <ul id="esineet_ja_mekanismit">
                    <li>Esine tai mekanismi</li>
                    <li>Esine tai mekanismi</li>
                </ul>
            </div>

            <div class="grid-container">
                <button id="pelinappi" class="grid-item" data-valinta="1">1</button>
                <button id="pelinappi" class="grid-item" data-valinta="2">2</button>
                <button id="pelinappi" class="grid-item" data-valinta="3">3</button>
                <button id="pelinappi" class="grid-item" data-valinta="4">4</button>
                <button id="pelinappi" class="grid-item" data-valinta="5">5</button>
                <button id="pelinappi" class="grid-item" data-valinta="6">6</button>
                <button id="pelinappi" class="grid-item" data-valinta="7">7</button>
                <button id="pelinappi" class="grid-item" data-valinta="8">8</button>
                <button id="pelinappi" class="grid-item" data-valinta="9">9</button>
                <button id="pelinappi" class="grid-item" data-valinta="10">10</button>
            </div>

            <div class="sivupaneeli">
                <h3>Tavaraluettelo</h3>
                <ul #tavaraluettelo>
                    <li>Tyhjä</li>
                </ul>
            </div>

        </section>

        <div class="peli-alapalkki">
            <button id="poistu" class="nappi nappi-poistu">Poistu pelistä</button>
        </div>

    </main>
</body>
</html>
